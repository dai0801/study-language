name: Build Study Large Library + Static Audio

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: "smoke-audio"
        type: choice
        options:
          - smoke-audio
          - full-audio
          - fast-ui

permissions:
  contents: write

jobs:
  fast-ui:
    if: ${{ inputs.mode == 'fast-ui' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Keep existing static audio
        run: |
          if [ -d study_cloudbase_free/dist/audio ]; then
            mkdir -p /tmp/study-audio
            cp -a study_cloudbase_free/dist/audio/. /tmp/study-audio/
          fi
      - name: Build library and UI
        working-directory: study_cloudbase_free
        run: |
          npm install
          npm run build
          rm -rf dist/tts
      - name: Restore static audio
        run: |
          if [ -d /tmp/study-audio ]; then
            mkdir -p study_cloudbase_free/dist/audio
            cp -a /tmp/study-audio/. study_cloudbase_free/dist/audio/
          else
            echo "No existing audio found. Run full-audio once first."
            exit 1
          fi
      - name: Commit dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f study_cloudbase_free/dist
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build Study UI with static audio"
            git push
          fi

  build-data:
    if: ${{ inputs.mode == 'full-audio' || inputs.mode == 'smoke-audio' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build large library
        working-directory: study_cloudbase_free
        run: |
          npm install
          npm run build
          rm -rf dist/tts
      - uses: actions/upload-artifact@v4
        with:
          name: base-dist
          path: study_cloudbase_free/dist
          retention-days: 1

  tts:
    if: ${{ inputs.mode == 'full-audio' || inputs.mode == 'smoke-audio' }}
    needs: build-data
    strategy:
      fail-fast: false
      matrix:
        lang: [ko, en, th]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: base-dist
          path: study_cloudbase_free/dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install CPU TTS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install "transformers>=4.45,<5" "numpy>=1.26" "sentencepiece>=0.2" "uroman>=1.3"

      - name: Create self-contained TTS generator
        shell: bash
        run: |
          cat > /tmp/generate_static_tts.py <<'PY'
          #!/usr/bin/env python3
          import argparse, json, os, subprocess, tempfile, wave
          from pathlib import Path
          
          import numpy as np
          import torch
          from transformers import AutoTokenizer, VitsModel
          
          MODELS = {
              "ko": "facebook/mms-tts-kor",
              "en": "facebook/mms-tts-eng",
              "th": "facebook/mms-tts-tha",
          }
          
          def audio_key(lang, text):
              value = f"{lang}\0{' '.join(str(text or '').split())}"
              h1 = 0x811c9dc5
              h2 = 0x9e3779b9
              for ch in value:
                  c = ord(ch)
                  h1 = (((h1 ^ c) * 0x01000193) & 0xffffffff)
                  h2 = (((h2 ^ c) * 0x85ebca6b) & 0xffffffff)
              return f"{h1:08x}{h2:08x}"
          
          def write_wav(path, samples, rate):
              x = np.clip(samples, -1.0, 1.0)
              pcm = (x * 32767.0).astype(np.int16)
              with wave.open(str(path), "wb") as w:
                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(int(rate))
                  w.writeframes(pcm.tobytes())
          
          def encode_m4a(wav_path, out_path, bitrate):
              subprocess.run([
                  "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
                  "-i", str(wav_path), "-vn", "-ac", "1",
                  "-c:a", "aac", "-b:a", bitrate, "-movflags", "+faststart",
                  str(out_path)
              ], check=True)
          
          def synthesize(model, tokenizer, text):
              inputs = tokenizer(text, return_tensors="pt")
              with torch.inference_mode():
                  wav = model(**inputs).waveform.squeeze().detach().cpu().numpy().astype(np.float32)
              if wav.size == 0:
                  raise RuntimeError("empty waveform")
              peak = float(np.max(np.abs(wav)))
              if peak > 0.03:
                  wav = wav * min(1.8, 0.88 / peak)
              return np.clip(wav, -0.98, 0.98)
          
          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--lang", choices=["ko","en","th"], required=True)
              ap.add_argument("--dist", required=True)
              ap.add_argument("--shard-size", type=int, default=60)
              ap.add_argument("--bitrate", default="32k")
              ap.add_argument("--limit", type=int, default=0)
              args = ap.parse_args()
          
              torch.set_num_threads(max(1, min(4, os.cpu_count() or 2)))
              torch.manual_seed(7)
          
              dist = Path(args.dist)
              data_path = dist / "data" / f"{args.lang}.json"
              if not data_path.exists():
                  raise FileNotFoundError(f"Missing data file: {data_path}")
          
              payload = json.loads(data_path.read_text("utf-8"))
              items = payload.get("items", payload if isinstance(payload, list) else [])
          
              unique, seen = [], set()
              for item in items:
                  text = " ".join(str(item.get("front","")).split()).strip()
                  if not text:
                      continue
                  key = audio_key(args.lang, text)
                  if key in seen:
                      continue
                  seen.add(key)
                  unique.append((key, text))
          
              if args.limit:
                  unique = unique[:args.limit]
          
              out_dir = dist / "audio" / args.lang
              out_dir.mkdir(parents=True, exist_ok=True)
          
              model_id = MODELS[args.lang]
              print(f"[{args.lang}] Loading {model_id} ...", flush=True)
              tokenizer = AutoTokenizer.from_pretrained(model_id)
              model = VitsModel.from_pretrained(model_id)
              model.eval()
              rate = int(model.config.sampling_rate)
              print(f"[{args.lang}] {len(unique)} texts, sample rate {rate}", flush=True)
          
              manifest = {}
              pre = np.zeros(int(rate * 0.045), dtype=np.float32)
              gap = np.zeros(int(rate * 0.115), dtype=np.float32)
              shard_size = max(1, args.shard_size)
          
              for shard_no, start_idx in enumerate(range(0, len(unique), shard_size)):
                  group = unique[start_idx:start_idx+shard_size]
                  filename = f"s{shard_no:04d}.m4a"
                  parts, cursor, ok = [], 0.0, 0
          
                  for local_idx, (key, text) in enumerate(group):
                      try:
                          torch.manual_seed(7)
                          speech = synthesize(model, tokenizer, text)
                          clip_start = cursor + len(pre) / rate
                          clip_end = clip_start + len(speech) / rate
                          parts.extend([pre, speech, gap])
                          cursor += (len(pre) + len(speech) + len(gap)) / rate
                          manifest[key] = [
                              filename,
                              round(max(0, clip_start - 0.015), 3),
                              round(clip_end + 0.045, 3)
                          ]
                          ok += 1
                      except Exception as exc:
                          print(f"[{args.lang}] skip {text[:60]!r}: {exc}", flush=True)
          
                      done = start_idx + local_idx + 1
                      if done % 25 == 0 or done == len(unique):
                          print(f"[{args.lang}] generated {done}/{len(unique)}", flush=True)
          
                  if parts:
                      merged = np.concatenate(parts)
                      with tempfile.TemporaryDirectory() as td:
                          wav_path = Path(td) / "sprite.wav"
                          write_wav(wav_path, merged, rate)
                          encode_m4a(wav_path, out_dir / filename, args.bitrate)
                      print(f"[{args.lang}] {filename}: {ok} clips, {cursor:.1f}s", flush=True)
          
              meta = {
                  "version": "3.7.2",
                  "lang": args.lang,
                  "model": model_id,
                  "codec": "AAC-LC",
                  "bitrate": args.bitrate,
                  "shardSize": shard_size,
                  "count": len(manifest),
                  "items": manifest,
              }
              (out_dir / "manifest.json").write_text(
                  json.dumps(meta, ensure_ascii=False, separators=(",",":")),
                  "utf-8"
              )
              print(f"[{args.lang}] done: {len(manifest)} entries", flush=True)
          
          if __name__ == "__main__":
              main()
          PY
          python -m py_compile /tmp/generate_static_tts.py
          echo "Generator ready:"
          ls -lh /tmp/generate_static_tts.py

      - name: Generate ${{ matrix.lang }} static audio
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ inputs.mode }}" = "smoke-audio" ]; then
            EXTRA="--limit 12"
          fi

          python /tmp/generate_static_tts.py             --lang ${{ matrix.lang }}             --dist study_cloudbase_free/dist             --shard-size 60             --bitrate 32k             $EXTRA

      - uses: actions/upload-artifact@v4
        with:
          name: tts-${{ matrix.lang }}
          path: study_cloudbase_free/dist/audio/${{ matrix.lang }}
          retention-days: 1

  smoke-result:
    if: ${{ inputs.mode == 'smoke-audio' }}
    needs: [build-data, tts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tts-ko
          path: smoke/audio/ko
      - uses: actions/download-artifact@v4
        with:
          name: tts-en
          path: smoke/audio/en
      - uses: actions/download-artifact@v4
        with:
          name: tts-th
          path: smoke/audio/th
      - name: Verify three-language smoke audio
        run: |
          test -f smoke/audio/ko/manifest.json
          test -f smoke/audio/en/manifest.json
          test -f smoke/audio/th/manifest.json
          echo "Korean files:"
          find smoke/audio/ko -maxdepth 1 -type f -printf "%f\n"
          echo "English files:"
          find smoke/audio/en -maxdepth 1 -type f -printf "%f\n"
          echo "Thai files:"
          find smoke/audio/th -maxdepth 1 -type f -printf "%f\n"
          echo "SMOKE TEST PASSED"

  merge:
    if: ${{ inputs.mode == 'full-audio' }}
    needs: [build-data, tts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: base-dist
          path: study_cloudbase_free/dist
      - uses: actions/download-artifact@v4
        with:
          name: tts-ko
          path: study_cloudbase_free/dist/audio/ko
      - uses: actions/download-artifact@v4
        with:
          name: tts-en
          path: study_cloudbase_free/dist/audio/en
      - uses: actions/download-artifact@v4
        with:
          name: tts-th
          path: study_cloudbase_free/dist/audio/th
      - name: Commit complete dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f study_cloudbase_free/dist
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build full Study library with static TTS audio"
            git push
          fi
