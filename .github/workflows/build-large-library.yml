name: Build Study Large Library + Static Audio

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: "full-audio"
        type: choice
        options:
          - full-audio
          - fast-ui

permissions:
  contents: write

jobs:
  fast-ui:
    if: ${{ inputs.mode == 'fast-ui' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Keep existing static audio
        run: |
          if [ -d study_cloudbase_free/dist/audio ]; then
            mkdir -p /tmp/study-audio
            cp -a study_cloudbase_free/dist/audio/. /tmp/study-audio/
          fi
      - name: Build library and UI
        working-directory: study_cloudbase_free
        run: |
          npm install
          npm run build
          rm -rf dist/tts
      - name: Restore static audio
        run: |
          if [ -d /tmp/study-audio ]; then
            mkdir -p study_cloudbase_free/dist/audio
            cp -a /tmp/study-audio/. study_cloudbase_free/dist/audio/
          else
            echo "No existing audio found. Run full-audio once first."
            exit 1
          fi
      - name: Commit dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f study_cloudbase_free/dist
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build Study UI with static audio"
            git push
          fi

  build-data:
    if: ${{ inputs.mode == 'full-audio' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build large library
        working-directory: study_cloudbase_free
        run: |
          npm install
          npm run build
          rm -rf dist/tts
      - uses: actions/upload-artifact@v4
        with:
          name: base-dist
          path: study_cloudbase_free/dist
          retention-days: 1

  tts:
    if: ${{ inputs.mode == 'full-audio' }}
    needs: build-data
    strategy:
      fail-fast: false
      matrix:
        lang: [ko, en, th]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: base-dist
          path: study_cloudbase_free/dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: study_cloudbase_free/requirements-tts.txt
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install CPU TTS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r study_cloudbase_free/requirements-tts.txt
      - name: Generate ${{ matrix.lang }} static audio
        run: |
          python study_cloudbase_free/scripts/generate_static_tts.py \
            --lang ${{ matrix.lang }} \
            --dist study_cloudbase_free/dist \
            --shard-size 60 \
            --bitrate 32k
      - uses: actions/upload-artifact@v4
        with:
          name: tts-${{ matrix.lang }}
          path: study_cloudbase_free/dist/audio/${{ matrix.lang }}
          retention-days: 1

  merge:
    if: ${{ inputs.mode == 'full-audio' }}
    needs: [build-data, tts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: base-dist
          path: study_cloudbase_free/dist
      - uses: actions/download-artifact@v4
        with:
          name: tts-ko
          path: study_cloudbase_free/dist/audio/ko
      - uses: actions/download-artifact@v4
        with:
          name: tts-en
          path: study_cloudbase_free/dist/audio/en
      - uses: actions/download-artifact@v4
        with:
          name: tts-th
          path: study_cloudbase_free/dist/audio/th
      - name: Commit complete dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f study_cloudbase_free/dist
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build full Study library with static TTS audio"
            git push
          fi
