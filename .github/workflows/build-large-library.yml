name: Build Study Large Library

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Study
        working-directory: study_cloudbase_free
        run: |
          npm install
          npm run build

      - name: Safety check - no old TTS assets
        run: |
          rm -rf study_cloudbase_free/dist/audio
          rm -rf study_cloudbase_free/dist/tts
          test ! -d study_cloudbase_free/dist/audio
          test ! -d study_cloudbase_free/dist/tts
          echo "Clean build confirmed: no static audio and no eSpeak assets."

      - name: Commit generated dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f study_cloudbase_free/dist
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build clean Study website"
            git push
          fi
